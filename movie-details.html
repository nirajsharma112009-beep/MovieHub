<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen flex-col bg-stone-100 font-sans text-stone-900 antialiased">
    <header class="inset-x-0 border-b-[3px] border-rose-800 bg-white px-4 py-3.5 z-1">
        <div class="flex flex-row  gap-3">
            <div class="flex-1 flex gap-3 justify-between">
                <div class="flex gap-2">
                    <svg class="h-8 w-11" viewBox="0 0 40 30" aria-hidden="true">
                        <path d="M3 3h34v7a5 5 0 0 0 0 10v7H3v-7a5 5 0 0 0 0-10z" fill="#9f1239" />
                        <path d="M16 9v12l10-6z" fill="#fff" />
                        <path d="M11 5v20" stroke="#f9c6d3" stroke-width="1.5" stroke-dasharray="2 3" />
                    </svg>
                    <div>
                        <h1 class="text-xl font-bold leading-none tracking-tight text-stone-900">Movie<span
                                class="text-rose-800 font-extrabold">Hub</span></h1>
                        <p class="mt-1 text-[11px] leading-none text-stone-500">Find any movie</p>
                    </div>
                </div>

                <div class="hidden md:flex items-center gap-5 font-bold mr-5">
                    <a href="index.html">Home</a>
                    <a href="index.html">Search</a>
                    <a href="contact.html">Contact</a>
                </div>

                <div id="hamburger" class="flex md:hidden items-center hover:bg-slate-100 p-1 rounded-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </div>

            </div>
        </div>
    </header>


    <div id="movie-detail"
        class="mx-auto mb-10 mt-20 grid w-full max-w-5xl gap-6 rounded-2xl border border-stone-200 bg-white p-4 sm:p-6 md:grid-cols-[280px_1fr]">

    </div>

    <footer class="mt-auto bg-stone-900 text-xs text-stone-400" class="footer">
        <div
            class="mx-auto flex max-w-6xl flex-col items-center gap-3 px-4 py-5 sm:flex-row sm:justify-between sm:px-7">
            <div class="flex flex-col items-center gap-1 sm:flex-row sm:gap-3">
                <span class="flex items-center gap-2.5">
                    <svg class="h-22px w-30px" viewBox="0 0 40 30" aria-hidden="true">
                        <path d="M3 3h34v7a5 5 0 0 0 0 10v7H3v-7a5 5 0 0 0 0-10z" fill="#9f1239" />
                        <path d="M16 9v12l10-6z" fill="#fff" />
                    </svg>
                    <span class="text-sm font-bold text-white">Movie<span
                            class="text-amber-500 font-extrabold">Hub</span></span>
                </span>
                <span>Movie data from OMDb</span>
            </div>
            <div class="flex gap-5" aria-label="Footer">
                <p>© 2026 MovieHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="movie-details.js"></script>
</body>

</html>
